name: Release

# Push a tag like v0.2.0 to publish that version to npm.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub release
  id-token: write   # npm Trusted Publishing: no npm token is stored anywhere

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: pnpm typecheck && pnpm test && pnpm build
      # Trusted Publishing (set up once on npmjs.com → leakfix → Settings) signs
      # the package with provenance. Skip if this version is already on npm.
      - name: Publish to npm
        run: |
          version=$(node -p 'require("./package.json").version')
          if npm view "leakfix@$version" version >/dev/null 2>&1; then
            echo "leakfix@$version is already on npm"
          else
            npm publish --access public
          fi
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
